name: Aktualizacja dywidend

on:
  schedule:
    - cron: "0 5 * * 1"      # poniedziałek 05:00 UTC (06:00 zimą / 07:00 latem w Polsce)
  workflow_dispatch:          # przycisk "Run workflow" do ręcznego uruchomienia

permissions:
  contents: write             # potrzebne do commitowania pliku JSON

concurrency:
  group: dividends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Zależności
        run: pip install -r scripts/requirements.txt

      - name: Pobierz dywidendy
        run: python scripts/fetch_dividends.py

      - name: Commit i push (tylko gdy plik się zmienił)
        run: |
          if [ -z "$(git status --porcelain data/dividends.json)" ]; then
            echo "Brak zmian w data/dividends.json."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dividends.json
          git commit -m "chore: aktualizacja dividends.json ($(date -u +%F))"
          git push
